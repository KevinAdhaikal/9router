<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9Router - AI Infrastructure Management</title>
    <meta name="description" content="One endpoint for all your AI providers. Manage keys, monitor usage, and scale effortlessly." />
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var s = localStorage.getItem('theme');
          var t = s ? (JSON.parse(s).state || {}).theme : 'system';
          t = t || 'system';
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (t === 'system' && m)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      var d = document, r = d.documentElement, f = function() { r.classList.add('fonts-loaded'); };
      if (d.fonts && d.fonts.load) {
        d.fonts.load('24px "Material Symbols Outlined"').then(f).catch(f);
        setTimeout(f, 3000);
      } else {
        f();
      }
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
